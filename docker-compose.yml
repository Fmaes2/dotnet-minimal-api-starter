services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starterkit
    ports:
      - "5433:5432"
    volumes:
      - starterkit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starterkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=starterkit;Username=postgres;Password=postgres
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in the .env file}
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"

volumes:
  starterkit-data: